          若さが朽ちるのを見ていた<br>
          可能性が残れば希望に縋る<br>
          希望があれば手が伸びる<br>
          そして今いる現実を知る<br>
          手を伸ばさなくてもよいと<br>
          時の流れに知らされる必要があった<br>
          何者でもないし何者にもなれないと<br>
          肉体により知る<br>
          雪山で目を瞑れば待つのは死だが<br>
          希望に目を瞑ったところで、なあ<br>
          止せよ<br>
          若い自分をなじるのは止せ<br>
          為すのなら<br>
          花束を置け<br>
          餞になるだろう
        </p>
